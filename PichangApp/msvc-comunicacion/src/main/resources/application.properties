spring.application.name=msvc-comunicacion

# Puerto en el que se levanta este microservicio.  Es importante definirlo
# explícitamente para evitar conflictos con otros servicios del sistema.
server.port=8082

# Configuración de la base de datos en la nube (Supabase). Todas las 
# instancias del equipo se conectan a este entorno centralizado.
# NOTA: Usando pooler IPv4 para evitar problemas de DNS locales.
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?options=-c%20search_path=public
spring.datasource.username=postgres.pqukomxvkdmxceywkltx
spring.datasource.password=pichangapp4thewin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraciones de Hibernate: se emplea 'update' para sincronizar el
# esquema automáticamente.  Mostrar el SQL generado facilita la
# depuración durante el desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clave utilizada para verificar el token JWT.  Debe coincidir con la
# clave empleada para firmar los tokens en msvc-usuario.
config.security.oauth.jwt.key=clave_secreta_super_segura_para_pichangapp_jwt_2026



# RabbitMQ Config (CloudAMQP)
spring.rabbitmq.addresses=amqps://lbxulfmr:93xsvsKPGMXSxipjnQMhumxLMeZ0uR2C@shark.rmq.cloudamqp.com/lbxulfmr

# HikariCP: limitar conexiones para Supabase
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

msvc.usuario.url=http://localhost:8001
msvc.match.url=http://localhost:8081
spring.jpa.open-in-view=false
spring.devtools.restart.enabled=false