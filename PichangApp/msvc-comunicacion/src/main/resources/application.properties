spring.application.name=msvc-comunicacion

# Puerto en el que se levanta este microservicio.  Es importante definirlo
# explícitamente para evitar conflictos con otros servicios del sistema.
server.port=8082

# Configuración de la base de datos PostgreSQL local.  Para un entorno de
# desarrollo se utiliza una base dedicada para la comunicación.  En
# producción, estas credenciales deben ubicarse en variables de entorno o
# servicios de gestión de secretos.
spring.datasource.url=jdbc:postgresql://db.pqukomxvkdmxceywkltx.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=pichangapp4thewin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraciones de Hibernate: se emplea 'update' para sincronizar el
# esquema automáticamente.  Mostrar el SQL generado facilita la
# depuración durante el desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clave utilizada para verificar el token JWT.  Debe coincidir con la
# clave empleada para firmar los tokens en msvc-usuario.
config.security.oauth.jwt.key=clave_secreta_super_segura_para_pichangapp_jwt_2026



