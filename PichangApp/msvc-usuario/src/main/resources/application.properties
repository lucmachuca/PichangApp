server.port=8001
spring.application.name=msvc-usuario

spring.datasource.url=jdbc:postgresql://localhost:5432/pichangapp_usuarios
spring.datasource.username=postgres
spring.datasource.password=pichangapp4thewin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

config.security.oauth.jwt.key=clave_secreta_super_segura_para_pichangapp_jwt_2026

spring.jpa.open-in-view=false

# Desactiva el autoconfig de SpringDoc para evitar que intente cargar clases HAL
# incompatibles con la combinación de Spring Boot 4 y Spring HATEOAS. Sin estas
# propiedades, springdoc intenta crear HateoasHalProvider y busca la clase
# org.springframework.hateoas.mediatype.hal.Jackson2HalModule, provocando un
# ClassNotFoundException durante el arranque.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
