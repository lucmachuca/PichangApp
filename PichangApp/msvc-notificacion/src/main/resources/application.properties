spring.application.name=msvc-notificacion

# Puerto dedicado para el microservicio de notificaciones.  Se establece
# 8083 para evitar conflictos con otros servicios.
server.port=8083

# Configuración de la base de datos PostgreSQL.  Aunque este servicio es
# actualmente un esqueleto, definir la URL evita errores al iniciar Spring.
spring.datasource.url=jdbc:postgresql://localhost:5432/pichangapp_notificacion
spring.datasource.username=postgres
spring.datasource.password=pichangapp4thewin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate para generar el esquema automáticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
