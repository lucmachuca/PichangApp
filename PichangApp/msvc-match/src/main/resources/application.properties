spring.application.name=msvc-match

# Puerto en el que se ejecuta este microservicio de matches.  Ajustamos a
# 8081 para que no choque con los demás servicios.
server.port=8081

# Credenciales de la base de datos PostgreSQL local para match.  Este
# servicio necesita persistir interacciones y matches, por lo que se
# configura una base de datos dedicada.  Cambia las credenciales según tu
# entorno.
spring.datasource.url=jdbc:postgresql://db.pqukomxvkdmxceywkltx.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=pichangapp4thewin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate generará o actualizará el esquema automáticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clave secreta usada para validar JWT.  Debe ser igual a la que
# firma los tokens en msvc-usuario para que la validación funcione.
config.security.oauth.jwt.key=clave_secreta_super_segura_para_pichangapp_jwt_2026

