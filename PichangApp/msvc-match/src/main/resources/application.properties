spring.application.name=msvc-match

# Puerto en el que se ejecuta este microservicio de matches.  Ajustamos a
# 8081 para que no choque con los demás servicios.
server.port=8081

# Credenciales de la base de datos en la nube (Supabase) para match.
# Este servicio persiste los datos directamente en el entorno de equipo.
# NOTA: Usando pooler IPv4 para evitar problemas de DNS locales.
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?options=-c%20search_path=public
spring.datasource.username=postgres.pqukomxvkdmxceywkltx
spring.datasource.password=pichangapp4thewin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate generará o actualizará el esquema automáticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clave secreta usada para validar JWT.  Debe ser igual a la que
# firma los tokens en msvc-usuario para que la validación funcione.
config.security.oauth.jwt.key=clave_secreta_super_segura_para_pichangapp_jwt_2026

# RabbitMQ Config (CloudAMQP)
spring.rabbitmq.addresses=amqps://lbxulfmr:93xsvsKPGMXSxipjnQMhumxLMeZ0uR2C@shark.rmq.cloudamqp.com/lbxulfmr

# HikariCP: limitar conexiones para Supabase
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000